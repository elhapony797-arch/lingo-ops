<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<title>Lingo Ops</title>
<style>
body{margin:0;background:#0b1220;color:#fff;font-family:sans-serif;padding:24px 16px}
.card{background:#16213a;border-radius:16px;padding:18px;margin-top:16px}
h1{margin:0;font-size:1.8rem}
.en{font-size:1.2rem;direction:ltr;text-align:left}
.ar{color:#9fb3c8;margin-top:8px}
input,select{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:0;font-size:1.1rem;direction:ltr;margin-top:12px}
button{border:0;border-radius:12px;padding:13px 18px;font-size:1rem;margin:8px 4px 0 0}
.g{background:#22c55e;color:#000}.b{background:#3b82f6;color:#fff}.o{background:#f59e0b;color:#000}.x{background:#334155;color:#fff}.r{background:#ef4444;color:#fff}
.m{display:block;width:100%;text-align:right;background:#1e2b4a;color:#fff;margin:10px 0 0}
.lock{opacity:.4}
#fb{margin-top:12px;font-size:1.05rem}
.bar{height:12px;background:#0b1220;border-radius:8px;margin-top:6px;overflow:hidden}
.bar div{height:100%;background:#f59e0b}
.err{direction:ltr;text-align:left;background:#0b1220;border-radius:10px;padding:10px;margin-top:8px;font-size:.95rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stamp{background:#0b1220;border:2px dashed #475569;border-radius:14px;padding:12px;text-align:center;font-size:.9rem}
.stamp.on{border:2px solid #f59e0b}
.stamp .ic{font-size:2rem}
.cert{direction:ltr;text-align:center;background:#fffbea;color:#3b2a00;border:6px double #b8860b;border-radius:12px;padding:26px 14px;margin-top:16px}
.cert h2{margin:0;font-size:1.5rem;color:#8a6100}
.cert .nm{font-size:1.9rem;font-weight:bold;margin:14px 0;border-bottom:2px solid #b8860b;display:inline-block;padding:0 14px}
.cert p{margin:6px 0}
</style>
</head>
<body>
<h1>Lingo Ops</h1>
<div id="app"></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
